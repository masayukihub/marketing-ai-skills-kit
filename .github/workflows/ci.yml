name: Public Kit Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/doctor.py
      - run: python scripts/sanitize_check.py
      - run: python scripts/lock_distribution.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/install.py
      - run: python scripts/install.py --check
      - run: python scripts/demo.py
      - run: python scripts/demo.py
      - run: python scripts/verify_nochange.py
      - run: python scripts/demo_launch.py
      - run: python scripts/demo_launch.py
      - run: python scripts/verify_nochange.py --launch
      - run: python scripts/demo_edm_series.py
      - run: python scripts/demo_edm_series.py
      - run: python scripts/verify_nochange.py --launch --series
      - run: python scripts/build_release.py --dest ../public-export-check --zip ../release-candidate.zip
